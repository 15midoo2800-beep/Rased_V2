name: Build RASED APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Skeleton
        run: |
          flutter create --org com.rased --project-name rased_v2 temp_proj
          cp -r temp_proj/android ./android
          rm -rf temp_proj

      - name: Patch Android Config & Permissions & AGP Namespace
        run: |
          # 1. ضبط minSdkVersion ليكون 24 على الأقل لدعم NDK و Isar
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          fi

          # 2. حقن الصلاحيات وخدمة الخلفية في AndroidManifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/application>/i \        <service android:name="id.flutter.flutter_background_service.BackgroundService" android:foregroundServiceType="microphone|location" />' android/app/src/main/AndroidManifest.xml

          # 3. حل مشكلة Namespace لمكتبة isar_flutter_libs ومكتبات الطرف الثالث
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      if (project.android.namespace == null) {
                          project.android.namespace = project.group ?: "com.example.${project.name.replace('-', '_')}"
                      }
                  }
              }
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Isar Database Files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rased-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
