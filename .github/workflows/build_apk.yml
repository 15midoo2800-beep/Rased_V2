name: Build RASED APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Pinned Stable Version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Generate Android Skeleton
        run: |
          flutter create --org com.rased --project-name rased_v2 temp_proj
          cp -r temp_proj/android ./android
          rm -rf temp_proj

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Isar Database Files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Deep Patch Android & Plugin Issues
        run: |
          # 1. إعدادات التوافق في gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 2. ضبط compileSdkVersion إلى 34 و minSdkVersion إلى 24
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk .*/compileSdk 34/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/targetSdk .*/targetSdk 34/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle
          fi

          # 3. حقن صلاحيات الأندرويد وخدمة الخلفية في AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/application>/i \        <service android:name="id.flutter.flutter_background_service.BackgroundService" android:foregroundServiceType="microphone|location" android:exported="true" />' android/app/src/main/AndroidManifest.xml

          # 4. إصلاح مشكلة Namespace و compileSdkVersion 34 لجميع الحزم (بما فيها Isar)
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 34
                          if (namespace == null) {
                              namespace = project.group ?: "com.example.${project.name.replace('-', '_')}"
                          }
                      }
                  }
              }
          }
          EOF

          # 5. استبدال jcenter() المهمل بـ mavenCentral() في جميع الحزم
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} + || true

          # 6. إصلاح خطأ bigLargeIcon(null) في حزمة الإشعارات إن وجد
          find /home/runner/.pub-cache -name "FlutterLocalNotificationsPlugin.java" -exec sed -i 's/bigPictureStyle.bigLargeIcon(null);/bigPictureStyle.bigLargeIcon((android.graphics.Bitmap) null);/g' {} + || true

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rased-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
